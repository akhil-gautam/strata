<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Strata's app icon: three bars, light to dark, building up to the bar
       you use. Source for Resources/AppIcon.icns (regenerate with
       scripts/make-icon.sh). The squircle sits on the macOS icon grid:
       824 px wide, centred, with room for the shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecebe8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <path id="squircle" d="M512 72c260 0 345 0 393 48s48 133 48 392 0 345-48 393-133 47-393 47-345 0-393-47S72 772 72 512s0-344 47-392S252 72 512 72Z"/>
  </defs>
  <g transform="translate(512 512) scale(0.93636) translate(-512 -512)">
    <use href="#squircle" fill="url(#bg)" filter="url(#shadow)"/>
    <use href="#squircle" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="4"/>
    <rect x="322" y="296" width="380" height="92" rx="46" fill="#1d1c1a" fill-opacity="0.18"/>
    <rect x="262" y="424" width="500" height="104" rx="52" fill="#1d1c1a" fill-opacity="0.45"/>
    <rect x="196" y="566" width="632" height="132" rx="66" fill="#1d1c1a"/>
  </g>
</svg>
